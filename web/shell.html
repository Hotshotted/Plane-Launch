<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14213d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Junkyard Launch</title>
<script>
// ---- Audio: contexts, background handling, and the looping layers ----
// 1. Browsers keep an AudioContext suspended until a user gesture. Every context the page or the engine makes is remembered
//    here and resumed on the first tap / key.
// 2. When the page goes to the background (tab hidden, phone locked, app switched: visibilitychange, pagehide, blur) EVERY
//    context is suspended at once, even before the game is ready. They stay suspended after the page is visible again: the
//    game (which pauses itself and mutes its Master bus) releases them when the player taps Resume (window.__pwRelease).
//    If the game is not up yet, the first tap after coming back resumes them.
// 3. PWAudio plays the looping layers (garage and flight music, wind, ramp rumble) natively: AudioBufferSource loops run on
//    the browser's audio thread, so a busy phone cannot leave a gap at the loop point (the engine's own web loops restart
//    from the main thread). The game only sends each layer's level (and the wind's rate).
(function () {
  var Ctor = window.AudioContext || window.webkitAudioContext;
  if (!Ctor) { return; }
  var all = [];
  window.__ctxs = all;
  window.__pwHidden = false;
  window.__pwGameReady = false;
  var held = false;
  function Wrapped() {
    var c = new (Function.prototype.bind.apply(Ctor, [null].concat([].slice.call(arguments))))();
    all.push(c);
    if (held) { try { c.suspend(); } catch (e) {} }
    return c;
  }
  Wrapped.prototype = Ctor.prototype;
  window.AudioContext = Wrapped;
  if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
  function suspendAll() { all.forEach(function (c) { if (c.state === 'running') { try { c.suspend(); } catch (e) {} } }); }
  function resumeAll() { all.forEach(function (c) { if (c.state === 'suspended') { try { c.resume(); } catch (e) {} } }); }
  function hide() { window.__pwHidden = true; held = true; suspendAll(); }
  function show() { if (!document.hidden) { window.__pwHidden = false; } }
  document.addEventListener('visibilitychange', function () { if (document.hidden) { hide(); } else { show(); } });
  window.addEventListener('pagehide', hide);
  window.addEventListener('blur', hide);
  window.addEventListener('focus', show);
  window.addEventListener('pageshow', show);
  window.__pwRelease = function () { held = false; resumeAll(); };
  function gesture() {
    if (document.hidden || window.__pwHidden) { return; }
    if (held) { if (window.__pwGameReady) { return; } held = false; }
    resumeAll();
  }
  ['touchend', 'pointerup', 'click', 'keydown', 'mouseup'].forEach(function (ev) { window.addEventListener(ev, gesture, { capture: true }); });

  var api = { enabled: false };
  window.PWAudio = api;
  var ctx;
  try { ctx = new window.AudioContext({ latencyHint: 'playback' }); } catch (e) { try { ctx = new window.AudioContext(); } catch (e2) { return; } }
  ctx.__pw = true;
  window.__pwCtx = ctx;
  var master = ctx.createGain();
  var limiter = ctx.createDynamicsCompressor();          // a gentle limiter on everything the page plays
  limiter.threshold.value = -4; limiter.knee.value = 3; limiter.ratio.value = 20; limiter.attack.value = 0.003; limiter.release.value = 0.12;
  master.connect(limiter); limiter.connect(ctx.destination);
  var names = ['calm', 'hot', 'wind', 'rumble'];
  var gains = {}, want = {}, bufs = {}, srcs = {}, left = names.length, started = false, t0 = 0;
  names.forEach(function (n) { gains[n] = ctx.createGain(); gains[n].gain.value = 0; gains[n].connect(master); want[n] = -80; });
  function lin(db) { return db <= -70 ? 0 : Math.pow(10, db / 20); }
  function apply(n) { gains[n].gain.setTargetAtTime(lin(want[n]), ctx.currentTime, 0.04); }
  function startAll() {
    t0 = ctx.currentTime + 0.1;
    names.forEach(function (n) { var s = ctx.createBufferSource(); s.buffer = bufs[n]; s.loop = true; s.connect(gains[n]); s.start(t0); srcs[n] = s; });
    started = true;
    names.forEach(apply);
  }
  names.forEach(function (n) {
    fetch('audio/' + n + '.wav').then(function (r) { return r.arrayBuffer(); }).then(function (b) { return ctx.decodeAudioData(b); }).then(function (buf) {
      bufs[n] = buf; left--; if (left === 0) { startAll(); }
    }).catch(function () { api.enabled = false; });
  });
  api.enabled = true;
  api.set = function (n, db) { if (!(n in want)) { return; } want[n] = db; if (started) { apply(n); } };
  api.setMany = function (o) { for (var k in o) { api.set(k, o[k]); } };
  api.setRate = function (n, r) { if (srcs[n]) { srcs[n].playbackRate.setTargetAtTime(r, ctx.currentTime, 0.05); } };
  api.setHeld = function (b) { master.gain.setTargetAtTime(b ? 0 : 1, ctx.currentTime, 0.015); };
  // seconds into the music loop (the game waits for the next sixteenth before a scrap plink)
  api.phase = function () { return started ? ((ctx.currentTime - t0) % bufs.calm.duration + bufs.calm.duration) % bufs.calm.duration : -1; };
})();
</script>
<style>
@font-face { font-family: "Fredoka"; src: url("Fredoka.ttf"); font-weight: 300 700; font-display: swap; }
:root { --bg: #14213d; --bg2: #1d3157; --ink: #0a1020; --text: #ffffff; --soft: #bcd0ec; --green: #35c98a; --green-dark: #1a8a5a; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
#canvas { display: block; width: 100%; height: 100%; outline: none; }
/* the loading page: brand colour, the Clear Prop Games mark, a progress bar; no text but the name */
#loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
  background: radial-gradient(circle at 50% 38%, var(--bg2), var(--bg) 70%); transition: opacity .35s ease; z-index: 10;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
#loader.done { opacity: 0; pointer-events: none; }
#mark { width: min(34vw, 190px); height: auto; animation: spin 2.4s cubic-bezier(.4,.1,.3,1) infinite; transform-origin: 50% 50%; filter: drop-shadow(0 6px 10px rgba(1,3,8,.45)); }
@keyframes spin { to { transform: rotate(360deg); } }
#name { font: 600 clamp(28px, 7vw, 44px)/1.05 "Fredoka", "Trebuchet MS", system-ui, sans-serif; color: var(--text); text-align: center; letter-spacing: .5px; }
#bar { width: min(62vw, 340px); height: 14px; border-radius: 99px; background: rgba(10,16,32,.7); box-shadow: inset 0 0 0 2px rgba(188,208,236,.25); overflow: hidden; }
#fill { width: 0%; height: 100%; border-radius: 99px; background: var(--green); box-shadow: inset 0 -4px 0 var(--green-dark); transition: width .25s ease-out; }
#fill.wait { width: 40% !important; animation: slide 1.1s ease-in-out infinite alternate; }
@keyframes slide { from { margin-left: 0; } to { margin-left: 60%; } }
#fail { display: none; color: var(--soft); font: 700 18px/1.3 "Fredoka", system-ui, sans-serif; text-align: center; max-width: 80vw; }
#fail button { margin-top: 14px; padding: 12px 28px; border: 0; border-radius: 99px; background: var(--green); color: #fff; font: 600 20px "Fredoka", system-ui, sans-serif; box-shadow: 0 6px 0 var(--green-dark); }
</style>
$GODOT_HEAD_INCLUDE
</head>
<body>
<canvas id="canvas" tabindex="0"></canvas>
<div id="loader" aria-label="Loading">
  <svg id="mark" viewBox="-100 -100 200 200" aria-hidden="true">
    <g fill="#ffffff">
      <path id="b" d="M-17 -14 L-30 -62 L-6 -97 L24 -72 L17 -14 Z"/>
      <use href="#b" transform="rotate(120)"/>
      <use href="#b" transform="rotate(240)"/>
      <circle r="27"/>
    </g>
    <circle r="14" fill="#ffc933"/>
  </svg>
  <div id="name">Clear Prop<br>Games</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="fail">The game could not start on this browser.<br><button onclick="location.reload()">Try again</button></div>
</div>
<script src="$GODOT_URL"></script>
<script>
(function () {
  var GODOT_CONFIG = $GODOT_CONFIG;
  var engine = new Engine(GODOT_CONFIG);
  var loader = document.getElementById("loader");
  var fill = document.getElementById("fill");
  var shown = 0;
  function setBar(p) { shown = Math.max(shown, p); fill.style.width = (shown * 100).toFixed(1) + "%"; }
  fill.classList.add("wait");   // until the first size report arrives
  function fail() {
    document.getElementById("bar").style.display = "none";
    document.getElementById("fail").style.display = "block";
  }
  var missing = Engine.getMissingFeatures({ threads: false });
  if (missing.length > 0) { fail(); return; }
  engine.startGame({
    onProgress: function (current, total) {
      if (total > 0) { fill.classList.remove("wait"); setBar(current / total * 0.9); }
    }
  }).then(function () {
    fill.classList.remove("wait");
    setBar(1);
    // the engine's own pre-warm splash (same colour) takes over; fade the page out
    setTimeout(function () { loader.classList.add("done"); setTimeout(function () { loader.style.display = "none"; }, 400); }, 250);
  }, function () { fail(); });
})();
</script>
</body>
</html>
